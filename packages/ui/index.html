<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>concordance</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="bar">
      <h1>concordance</h1>
      <span id="connection" class="muted">connecting</span>
    </header>
    <div class="layout">
      <main>
        <section id="answer" class="answer" aria-live="polite"></section>
        <p id="score" class="score"></p>
        <p id="status" class="status muted"></p>
        <section class="evidence" aria-labelledby="evidence-title">
          <h2 id="evidence-title" class="muted">Evidence</h2>
          <ol id="evidence" class="evidence-list"></ol>
        </section>
      </main>
      <aside id="viewer" class="viewer" hidden aria-labelledby="viewer-title">
        <div class="viewer-bar">
          <strong id="viewer-title" class="viewer-title"></strong>
          <button type="button" id="viewer-prev" class="small" aria-label="Previous page">‹</button>
          <span id="viewer-page" class="muted"></span>
          <button type="button" id="viewer-next" class="small" aria-label="Next page">›</button>
          <button type="button" id="viewer-close" class="small" aria-label="Close viewer">×</button>
        </div>
        <p id="viewer-message" class="viewer-message muted"></p>
        <div class="viewer-body"><canvas id="viewer-canvas"></canvas></div>
      </aside>
    </div>
    <form id="ask" class="ask">
      <textarea
        id="question"
        rows="2"
        placeholder="Ask about the witness statements"
        required
      ></textarea>
      <div class="buttons">
        <button type="submit" id="send">Send</button>
        <button type="button" id="cancel" disabled>Cancel</button>
      </div>
    </form>
  </body>
</html>
