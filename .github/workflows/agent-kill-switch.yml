# Sets the agent kill switch. Every unattended agent path (agent-board.yml, agent-code.yml and
# agent-pr.yml) reads /concordance/sandbox/agents/kill-switch through
# .github/actions/agent-kill-switch before it acts and stops when the flag is on, so this one
# dispatch is how the operator stops all of them from anywhere gh runs:
#
#   gh workflow run agent-kill-switch.yml -f state=on
#   gh workflow run agent-kill-switch.yml -f state=off
#
# The parameter itself is created by the guardrails stack (concordance-sandbox-guardrails) with
# the value off; this workflow only ever overwrites it.

name: agent kill switch

on:
  workflow_dispatch:
    inputs:
      state:
        description: "on stops every unattended agent path; off lets them run"
        required: true
        type: choice
        options:
          - "on"
          - "off"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2

jobs:
  set:
    name: "set the kill switch ${{ inputs.state }}"
    if: vars.CONCORDANCE_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: sandbox
    env:
      KILL_SWITCH_PARAMETER: /concordance/sandbox/agents/kill-switch
      KILL_SWITCH_STATE: ${{ inputs.state }}
    steps:
      - name: Configure AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.CONCORDANCE_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-concordance-kill-switch-${{ github.run_id }}
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          retry-max-attempts: 3

      - name: Set the kill switch
        run: |
          set -euo pipefail
          aws ssm put-parameter --name "$KILL_SWITCH_PARAMETER" --type String --value "$KILL_SWITCH_STATE" --overwrite
          state=$(aws ssm get-parameter --name "$KILL_SWITCH_PARAMETER" --query 'Parameter.Value' --output text)
          echo "$KILL_SWITCH_PARAMETER is now $state" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$state" != "$KILL_SWITCH_STATE" ]; then
            echo "::error::the read-back value '$state' is not the requested '$KILL_SWITCH_STATE'"
            exit 1
          fi
