# The offline checks on every branch push and every pull request: format, lint, the unit suite
# (no Docker, no Ollama) and a CDK synth. The synth needs no AWS credentials, because no stack
# looks anything up.

name: test
run-name: "test from ${{ github.ref_name }}"

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check format
        run: npm run check:format

      - name: Check lint
        run: npm run check:lint

      - name: Unit tests
        run: npm run test:unit

      - name: CDK synth
        run: npm run check:synth

  browser:
    name: browser
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Browser tests
        run: CONCORDANCE_BROWSER_TESTS=1 CHROME_BIN="$(command -v google-chrome)" npx vitest run test/browser
